<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Reflection Journal</title>
    <meta name="description" content="A user-authenticated reflection and journaling application powered by Gemini 3.6 Flash and Cloud Firestore with user-isolated persistence." />
    <meta property="og:title" content="Gemini Reflection Journal" />
    <meta property="og:description" content="A user-authenticated reflection and journaling application powered by Gemini 3.6 Flash and Cloud Firestore with user-isolated persistence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('gemini_journal_theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          var savedAccent = localStorage.getItem('gemini_journal_accent');
          if (savedAccent && ['violet', 'ocean', 'emerald', 'rose', 'amber'].indexOf(savedAccent) !== -1) {
            document.documentElement.setAttribute('data-accent', savedAccent);
          } else {
            document.documentElement.setAttribute('data-accent', 'violet');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
